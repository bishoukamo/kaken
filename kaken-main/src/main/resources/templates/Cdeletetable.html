<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>抹消済み薬品一覧</title>

            <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu-style.css">
    <link rel="stylesheet" href="button-style.css">
    <link rel="stylesheet" href="table.css">

    <style>
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;

            z-index: 1000;
        }
    </style>
    </head>


    <body>

        <div class="header">
            <h2>薬品管理システム</h2>
        </div>

        <div id="maingamen">
            <div class="box">
    <table border="1" class="log-table">
        <tr>
            <th>
                <a href="/cdelete?sort=D_id&order=ASC">抹消済み薬品ID▲</a>
                <a href="/cdelete?sort=D_id&order=DESC">▼</a>
            </th>

            <th>
                <a href="/cdelete?sort=M_id&order=ASC">管理ID▲</a>
                <a href="/cdelete?sort=M_id&order=DESC">▼</a>
            </th>

            <th>
                <a href="/cdelete?sort=D_date&order=ASC">削除日▲</a>
                <a href="/cdelete?sort=D_date&order=DESC">▼</a>
            </th>
        </tr>

        <tr th:each="data : ${deleteList}">
            <td th:text="${data.D_id}"></td>
            <td th:text="${data.M_id}"></td>
            <td th:text="${#temporals.format(data.D_date, 'yyyy/MM/dd')}"></td>
        </tr>
    </table>
    </body>
    </div>
    </div>
        <app-menu></app-menu>
    <script src="menu-script.js"></script>

</html>
