<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>薬品削除</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>


</style>

</head>
<body>
<div class="header"> <h1>薬品管理システム</h1> </div>

<div class="card">

    <div class="card-body">
       
         <form action="DeleteMedicineServlet" method="post"    
      onsubmit="return confirm('この薬品を削除しますか？');">   <!--上の部分が送るところの指定してる-->
            <div class="mb-3">
               
              <label for="medicineName" class="form-label">
                    削除する薬品名
                </label>

                <input type="text"
                       class="form-control"
                       id="medicineName"
                       name="medicineName"
                       placeholder="薬品名を入力してください"
                       required
                       >
            </div>

            
            

        </form>

        <div class="col-md-3 d-flex flex-column gap-2  width-466px">
            <button type="submit" class="btn btn-danger">
                削除
            </button>

            <a href="deleterireki.html" class="btn btn-primary">
                削除履歴
            </a>
        </div>

        <div class="mt-3 text-center">
            <a href="homegamen.html" class="btn btn-secondary">
                ホームへ戻る
            </a>
        </div>

    </div>
</div>

</body>
</html>
