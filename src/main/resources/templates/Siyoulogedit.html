<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>使用記録編集</title>
</head>

<body>

<h1>使用記録編集</h1>

<form th:action="@{/siyoulog/edit}" th:object="${siyoulog}" method="post">
    
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{log_id}">

    <p>
        管理ID：
        <input type="number" th:field="*{M_id}">
    </p>

    <p>
        薬品ID：
        <input type="number" th:field="*{C_id}">
    </p>

    <p>
        実習室ID：
        <input type="number" th:field="*{PTR_id}">
    </p>

    <p>
        使用前総重量：
        <input type="number" step="0.01" th:field="*{bf_weight}">
    </p>

    <p>
        使用後総重量：
        <input type="number" step="0.01" th:field="*{af_weight}">
    </p>

    <button type="submit">保存</button>

</form>

<a href="/siyoulog">戻る</a>

</body>
</html>
