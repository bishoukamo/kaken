<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QRコード再発行</title>

    <!-- CSRF -->
    <meta name="_csrf"
          th:content="${_csrf.token}">
    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        body {
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
            font-family:
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                Meiryo,
                sans-serif;
        }

        .container {
            width: 600px;
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14pt;
        }

        /* 警告 */
        .warning {
            margin: 25px 0;
            padding: 15px;
            border: 2px solid #d9534f;
            background: #fff5f5;
            border-radius: 6px;
            line-height: 1.6;
        }

        .warning-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        button {
            padding: 10px 20px;
            font-size: 14pt;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #reissueBtn {
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        #printBtn {
            display: none;
            margin-top: 15px;
        }

        /* QRラベル */
        .box2 {
            display: none;

            background: white;
            width: 70mm;
            height: 42.3mm;

            margin: 30px auto 0;

            padding: 1mm;
            box-sizing: border-box;

            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }

        .qr-label {
            width: 68mm;
            height: 40.3mm;

            margin: 0 auto;

            text-align: center;

            font-family:
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                Meiryo,
                sans-serif;

            box-sizing: border-box;
        }

        .m-id {
            width: 100%;

            font-size: 10pt;
            font-weight: bold;

            line-height: 1.1;

            margin: 0 0 0.5mm 0;

            word-break: break-all;
        }

        .c-name {
            width: 100%;

            font-size: 9pt;
            font-weight: bold;

            line-height: 1.1;

            margin: 0 0 1mm 0;

            word-break: break-word;

            /*
             * 薬品名は最大2行
             */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #qrcode {
            width: 32mm;
            height: 32mm;

            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
        }

        #qrcode canvas,
        #qrcode img {
            width: 32mm !important;
            height: 32mm !important;

            display: block;
        }


        /* ==========================================
           印刷
           ========================================== */

        @media print {

            @page {
                size: A4 portrait;
                margin: 0;
            }

            .no-print {
                display: none !important;
            }

            body {
                display: block;
                background: white;

                margin: 0;
                padding: 0;
            }

            .box2 {
                display: block !important;

                width: 70mm;
                height: 42.3mm;
                min-height: 42.3mm;

                padding: 1mm;

                margin: 0;

                box-sizing: border-box;

                background: white;

                box-shadow: none;
                border-radius: 0;
            }

            .qr-label {
                width: 68mm;
                height: 40.3mm;

                margin: 0 auto;

                display: flex;
                flex-direction: column;

                align-items: center;
                justify-content: flex-start;

                text-align: center;

                box-sizing: border-box;
            }

            .m-id {
                width: 100%;

                font-size: 9pt;
                font-weight: bold;

                line-height: 1.1;

                margin: 0 0 0.5mm 0;

                word-break: break-all;
            }

            .c-name {
                width: 100%;

                font-size: 9pt;
                font-weight: bold;

                line-height: 1.1;

                margin: 0 0 1mm 0;

                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;

                overflow: hidden;
                word-break: break-word;
            }

            #qrcode {
                width: 32mm;
                height: 32mm;

                margin: 0 auto;

                display: flex;
                justify-content: center;
                align-items: center;

                flex-shrink: 0;
            }

            #qrcode canvas,
            #qrcode img {
                width: 32mm !important;
                height: 32mm !important;

                display: block;
            }
        }

    </style>

</head>


<body>

<div class="container no-print">

    <h1>QRコード再発行</h1>


    <!-- ==========================================
         薬品情報入力
         ========================================== -->

    <div class="form-group">

        <label for="materialId">
            容器番号（M_id）
        </label>

        <input
            type="number"
            id="materialId"
            placeholder="容器番号を入力してください"
        >

    </div>


    <div class="form-group">

        <label for="chemicalName">
            薬品名
        </label>

        <input
            type="text"
            id="chemicalName"
            placeholder="薬品名を入力してください"
        >

    </div>


    <!-- ==========================================
         警告
         ========================================== -->

    <div class="warning">

        <div class="warning-title">
            ⚠️ QRコード再発行時の注意
        </div>

        再発行すると、現在使用している
        <strong>旧QRコードは使用できなくなります。</strong>

        <br>

        新しく発行されたQRコードをご利用ください。

    </div>


    <!-- ==========================================
         再発行ボタン
         ========================================== -->

    <button
        type="button"
        id="reissueBtn"
        onclick="reissueQR()">

        QRコードを再発行

    </button>


    <!-- ==========================================
         印刷ボタン
         ========================================== -->

    <button
        type="button"
        id="printBtn"
        onclick="printQR()">

        QRコード印刷

    </button>

</div>


<!-- ==========================================
     QRラベル
     ========================================== -->

<div class="box2">

    <div class="qr-label">

        <!-- M_id -->
        <div
            class="m-id"
            id="labelMaterialId">
        </div>


        <!-- 薬品名 -->
        <div
            class="c-name"
            id="labelChemicalName">
        </div>


        <!-- QR -->
        <div id="qrcode"></div>

    </div>

</div>


<script>

    let qrToken = null;
    let qrValue = null;


    /* ==========================================
       QRコード再発行
       ========================================== */

    async function reissueQR() {

        const materialId =
            document.getElementById("materialId").value.trim();

        const chemicalName =
            document.getElementById("chemicalName").value.trim();


        /* ------------------------------------------
           M_idチェック
           ------------------------------------------ */

        if (!materialId) {

            alert("容器番号（M_id）を入力してください。");

            return;
        }


        /* ------------------------------------------
           薬品名チェック
           ------------------------------------------ */

        if (!chemicalName) {

            alert("薬品名を入力してください。");

            return;
        }


        /* ------------------------------------------
           再発行確認
           ------------------------------------------ */

        const confirmed = confirm(
            "QRコードを再発行しますか？\n\n" +
            "再発行すると、現在のQRコードは使用できなくなります。\n" +
            "新しいQRコードが発行されます。"
        );


        if (!confirmed) {

            return;
        }


        try {

            /* --------------------------------------
               CSRF
               -------------------------------------- */

            const csrfToken =
                document.querySelector(
                    'meta[name="_csrf"]'
                ).content;

            const csrfHeader =
                document.querySelector(
                    'meta[name="_csrf_header"]'
                ).content;


            /* --------------------------------------
               再発行API
               -------------------------------------- */

            const response = await fetch(
                "/admin/qr-labels/reissue?materialId="
                + encodeURIComponent(materialId),
                {
                    method: "POST",

                    headers: {
                        [csrfHeader]: csrfToken
                    }
                }
            );


            /* --------------------------------------
               JSON
               -------------------------------------- */

            const data =
                await response.json();


            /* --------------------------------------
               エラー
               -------------------------------------- */

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "QRコードの再発行に失敗しました"
                );
            }


            /* --------------------------------------
               QR情報
               -------------------------------------- */

            qrToken = data.qrToken;
            qrValue = data.qrValue;


            console.log("新しいqrToken =", qrToken);
            console.log("新しいqrValue =", qrValue);


            /* --------------------------------------
               ラベル表示
               -------------------------------------- */

            document.getElementById(
                "labelMaterialId"
            ).textContent =
                "容器ID: " + materialId;


            document.getElementById(
                "labelChemicalName"
            ).textContent =
                "薬品名: " + chemicalName;


            /* --------------------------------------
               古いQR削除
               -------------------------------------- */

            document.getElementById(
                "qrcode"
            ).innerHTML = "";


            /* --------------------------------------
               新しいQR生成
               -------------------------------------- */

            new QRCode(

                document.getElementById("qrcode"),

                {
                    text: qrValue,

                    width: 160,
                    height: 160,

                    correctLevel:
                        QRCode.CorrectLevel.L
                }

            );


            /* --------------------------------------
               ラベル表示
               -------------------------------------- */

            document.querySelector(
                ".box2"
            ).style.display = "block";


            /* --------------------------------------
               印刷ボタン表示
               -------------------------------------- */

            document.getElementById(
                "printBtn"
            ).style.display = "inline-block";


            alert(
                "QRコードを再発行しました。"
            );

        }

        catch (error) {

            console.error(
                "QRコード再発行エラー:",
                error
            );

            alert(error.message);

        }

    }


    /* ==========================================
       QR印刷
       ========================================== */

    function printQR() {

        window.print();

    }

</script>


</body>

</html>
