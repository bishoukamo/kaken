<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント削除</title>
</head>

<body>

<h1>アカウント削除</h1>

<p>
    アカウントを削除しますか？
</p>

<p>
    この操作は取り消すことができません。
</p>

<p>
    ユーザ名：
    <span th:text="${user.u_name}"></span>
</p>

<p>
    メールアドレス：
    <span th:text="${user.mail}"></span>
</p>

<form th:action="@{/account/delete}" method="post">

    <!-- CSRF対策 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <p>
        パスワード：
        <input type="password"
               name="password"
               required>
    </p>

    <p th:if="${error}"
       th:text="${error}"
       style="color:red;">
    </p>

    <button type="submit">
        アカウントを削除する
    </button>

</form>

<br>

<a th:href="@{/mypage}">
    マイページへ戻る
</a>

</body>
</html>
