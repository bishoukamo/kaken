<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>メールアドレス変更</title>
</head>

<body>

<h1>メールアドレス変更</h1>

<form th:action="@{/mail/change}" method="post">

    <!-- CSRF対策 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <p>
        現在のメールアドレス：
        <span th:text="${currentMail}"></span>
    </p>

    <p>
        現在のパスワード：
        <input type="password"
               name="password"
               required>
    </p>

    <p>
        新しいメールアドレス：
        <input type="email"
               name="newMail"
               required>
    </p>

    <p>
        新しいメールアドレス（確認）：
        <input type="email"
               name="newMailConfirm"
               required>
    </p>

    <p th:if="${error}"
       th:text="${error}"
       style="color:red;">
    </p>

    <button type="submit">変更する</button>

</form>

<br>

<a th:href="@{/mypage}">マイページへ戻る</a>

</body>
</html>
