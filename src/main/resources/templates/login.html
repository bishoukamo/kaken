<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログイン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .login-container {
            width: 360px;
            padding: 32px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-container h1 {
            margin-top: 0;
            margin-bottom: 24px;

            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;

            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #555;
        }

        .login-button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #333;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #555;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            display: inline-block;

            padding: 10px 20px;

            border: 1px solid #333;
            border-radius: 6px;

            color: #333;
            background: white;

            text-decoration: none;

            font-size: 14px;
            transition: 0.2s;
        }

        .register-link a:hover {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>ログイン</h1>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">ユーザー名</label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="ユーザー名を入力"
                    required
            >
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="パスワードを入力"
                    required
            >
        </div>

        <button
                type="submit"
                class="login-button"
        >
            ログイン
        </button>

        <div class="register-link">
            <a href="/register">
                アカウントを作成する
            </a>
        </div>

    </form>

    <div id="loginResult"></div>

    <script src="/js/login.js"></script>
</div>
</body>
</html>
