<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu-style.css">
    <link rel="stylesheet" href="button-style.css">
    <link rel="stylesheet" href="table.css">

    <style>
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;

            z-index: 1000;
        }
    </style>

    <head>
        <title>容器・在庫データ一覧</title>
    </head>
    <body>
        <div class="header">
            <h2>薬品管理システム</h2>
        </div>

        <div id="maingamen">

        <div class="box">
            <table border="1" class="log-table">
    <tr>

    <th>
        <a href="/capa?sort=M_id&order=ASC">薬品ID▲</a>
        <a href="/capa?sort=M_id&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=C_id&order=ASC">薬品名▲</a>
        <a href="/capa?sort=C_id&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=C_name&order=ASC">備考▲</a>
        <a href="/capa?sort=C_name&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=poisonType&order=ASC">劇毒▲</a>
        <a href="/capa?sort=poisonType&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=PRD&order=ASC">購入時内容量▲</a>
        <a href="/capa?sort=PRD&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=capa&order=ASC">購入時総重量▲</a>
        <a href="/capa?sort=capa&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=pur_weight&order=ASC">購入登録日▲</a>
        <a href="/capa?sort=pur_weight&order=DESC">▼</a>
    </th>

    <th>
        <a href="/capa?sort=remarks&order=ASC">管理ID▲</a>
        <a href="/capa?sort=remarks&order=DESC">▼</a>
    </th>
</tr>

    <tr th:each="data : ${capaList}">
        <td th:text="${data.C_id}"></td>
        <td th:text="${data.C_name}"></td>
        <td th:text="${data.remarks}"></td>
        <td th:text="${data.poisonType}"></td>
        <td th:text="${data.capa}"></td>
        <td th:text="${data.pur_weight}"></td>
        <td th:text="${#temporals.format(data.PRD, 'yyyy/MM/dd')}"></td>
        <td th:text="${data.M_id}"></td>
    </tr>
</table>
</div>
</body>
    <app-menu></app-menu>
    <script src="menu-script.js"></script>
</div>
</html>
