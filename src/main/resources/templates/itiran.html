<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>薬品一覧</title>

<body>
    <h1>薬品一覧</h1>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: "Yu Gothic", sans-serif;
        }

        .header {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            margin-top: 30px;
        }

        .card {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stock-ok {
            color: green;
            font-weight: bold;
        }

        .stock-low {
            color: red;
            font-weight: bold;
        }
        .low-stock {
            background-color: #ffb3b3;  
            color: red;
            font-weight: bold;
        }
   
   
    </style>

</head>




<!-- ヘッダー -->



<div class="container">


   <!-- 検索・追加エリア -->
<div class="row g-3 align-items-center">

    <!-- 検索欄＋検索ボタン -->
    <div class="col-md-7">
        <div class="input-group">
            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="薬品名を検索"
                   onkeydown="if(event.key === 'Enter') searchMedicine()">

            <button class="btn btn-primary"
                    onclick="searchMedicine()">
                検索
            </button>
        </div>
    </div>

   

</div>
    <br>




    <!-- 薬品一覧 -->
    <div class="card">


        <div class="card-header bg-primary text-white">

            薬品一覧

        </div>


        <div class="card-body">

            <table class="table table-bordered table-hover">


                <thead class="table-light">

                    <tr>

                        <th>ID</th>
                        <th>薬品名</th>
                        <th>残量</th>
                        <th>単位</th>
                        <th>登録日時</th>
                        <th>最終使用日</th>
                        <th>保管場所</th>

                    </tr>

                </thead>


                <tbody>


                    <tbody id="medicineTable">

<tr>
    <td>001</td>
    <td>アルコール</td>
    <td class="quantity">3</td>
    <td>本</td>
    <td>2026 12/23</td>
    <td>2026 12/25</td>
    <td>廊下</td>
</tr>

<tr>
    <td>002</td>
    <td>生理食塩水</td>
    <td class="quantity">5</td>
    <td>本</td>
    <td>2025 12/23</td>
    <td>2026 12/25</td>
    <td>屋上</td>
</tr>

</tbody>


            </table>
           

        </div>


    </div>


</div>


     <div class="mt-3 text-center">
        <button class="btn btn-secondary"
                onclick="location.href='homegamen.html'">
            ホーム画面
        </button>
    </div>

<script>

document.querySelectorAll(".quantity").forEach(cell => {
    if (Number(cell.textContent) <= 3) {
        cell.classList.add("low-stock");
    }
});

function searchMedicine(){

    // 入力文字取得
    let keyword = document.getElementById("searchInput").value.toLowerCase();

    // 表の行を取得
    let rows = document.querySelectorAll("#medicineTable tr");


    rows.forEach(function(row){

        // 薬品名（2列目）を取得
        let medicineName = row.cells[1].textContent.toLowerCase();


        // 部分一致検索
        if(medicineName.includes(keyword)){
            row.style.display = "";
        }
        else{
            row.style.display = "none";
        }

    });

}

</script>
</body>
</html>
