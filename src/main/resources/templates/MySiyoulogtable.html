<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>自分の使用記録</title>
    <link rel="stylesheet" href="table.css">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    
    
<body>
<div class="header">
    <h2>自分の使用記録</h2>
</div>


<div class="body">
    <div class="box">
        <!-- 使用記録がない場合 -->
        <p th:if="${message}" th:text="${message}"></p>
<table th:if="${not #lists.isEmpty(siyoulogList)}" class="log-table">
    <thead>
        <tr>
            <th>使用日時</th>
            <th>薬品名</th>
            <th>管理番号</th>
            <th>使用前総重量</th>
            <th>使用後総重量</th>
            <th>使用量</th>
            <th>実習室名</th>
            <th>編集</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="data : ${siyoulogList}" >
    
            <td th:text="${#temporals.format(data.useday, 'yyyy-MM-dd')}" th:scope="col"></td>

            <td th:text="${data.C_name}" th:scope="col"></td>

            <td th:text="${data.M_id}" th:scope="col"></td>

            <td th:text="${data.bf_weight}" th:scope="col"></td>

            <td th:text="${data.af_weight}" th:scope="col"></td>

            <!-- 使用量 = 使用前 - 使用後 -->
            <td th:text="${data.bf_weight - data.af_weight}" th:scope="col"></td>

            <td th:text="${data.PTR_name}" th:scope="col"></td>

            <td>
                <a th:href="@{/siyoulog/edit/{id}(id=${data.log_id})}">
                編集
                </a>
            </td>
        </tr>
    </tbody>
</table>

<br>
<a href="mypage.html" class="btn btn-secondary">戻る</a>
</div>
</div>
</body>
</html>
