<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
</head>

<body>

<h1>パスワード変更</h1>

<div th:if="${error}">
    <p th:text="${error}"></p>
</div>

<form th:action="@{/mypage/password}" method="post">

    <!-- CSRF対策 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <p>
        現在のパスワード：
        <input type="password"
               name="currentPassword"
               required>
    </p>

    <p>
        新しいパスワード：
        <input type="password"
               name="newPassword"
               required>
    </p>

    <p>
        新しいパスワード（確認）：
        <input type="password"
               name="confirmPassword"
               required>
    </p>

    <button type="submit">
        パスワードを変更
    </button>

</form>

<p>
    <a th:href="@{/mypage}">
        マイページに戻る
    </a>
</p>

</body>
</html>
