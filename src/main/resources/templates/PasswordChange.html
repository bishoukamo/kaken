<!DOCTYPE html> <html lang="ja" xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <title>パスワード変更</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
    /* ページ全体 */
    body {
        background-color: #f5f6fa;
        font-family: "Yu Gothic", "Meiryo", sans-serif;
        margin: 0;
        color: #333;
    }

    /* ヘッダー */
    .header {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

    .header h2 {
        margin: 0;
        font-weight: bold;
    }

    /* メインカード */
    .card {
        width: 600px;
        margin: 40px auto;
        padding: 35px;

        background-color: #ffffff;
        border: none;
        border-radius: 10px;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    /* 入力項目 */
    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        font-weight: bold;
        margin-bottom: 8px;
        color: #444;
    }

    .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #4a69bd;
        box-shadow: 0 0 0 0.2rem rgba(74, 105, 189, 0.2);
    }

    /* エラーメッセージ */
    .error-message {
        background-color: #ffe5e5;
        color: #dc3545;
        border: 1px solid #f5b5b5;
        border-radius: 6px;
        padding: 10px 15px;
        margin-bottom: 20px;
    }

    /* ボタンエリア */
    .button-area {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 30px;
    }

    /* 変更ボタン */
    .change-button {
        background-color: #4a69bd;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 6px;
        cursor: pointer;
    }

    .change-button:hover {
        background-color: #3b55a0;
    }

    /* 戻るボタン */
    .back-button {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 6px;
        cursor: pointer;
    }

    .back-button:hover {
        background-color: #5c636a;
    }
</style>

</head> <body>
<!-- ヘッダー -->
<div class="header">
    <h2>パスワード変更</h2>
</div>

<!-- メインカード -->
<div class="card">

    <!-- エラーメッセージ -->
    <div th:if="${error != null}"
     id="error"
     class="error-message"
     style="display: none;">
    <span th:text="${error}"></span>
</div>

    <!-- パスワード変更フォーム -->
    <form th:action="@{/mypage/password}" method="post">

        <!-- CSRF対策 -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- 現在のパスワード -->
        <div class="form-group">
            <label class="form-label">
                現在のパスワード
            </label>

            <input type="password"
                   class="form-control"
                   name="currentPassword"
                   required>
        </div>

        <!-- 新しいパスワード -->
        <div class="form-group">
            <label class="form-label">
                新しいパスワード
            </label>

            <input type="password"
                   class="form-control"
                   name="newPassword"
                   required>
        </div>

        <!-- 新しいパスワード（確認） -->
        <div class="form-group">
            <label class="form-label">
                新しいパスワード（確認）
            </label>

            <input type="password"
                   class="form-control"
                   name="confirmPassword"
                   required>
        </div>

        <!-- ボタン -->
        <div class="button-area">

            <button class="back-button"
                    type="button"
                    onclick="location.href='homegamen.html'">
                ホームへ戻る
            </button>

            <button class="change-button"
                    type="submit">
                変更する
            </button>

        </div>

    </form>

</div>
<script th:inline="javascript">
    const error = /*[[${error}]]*/ null;

    if (error) {
        document.getElementById("error").style.display = "block";
    }
</script>
</body> </html>
