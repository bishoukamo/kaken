<!DOCTYPE html>
<html lang="ja">
<head>
   
    <meta charset="UTF-8">
    <title>薬品登録</title>

    <style>
        body {
            font-family: "Arial", sans-serif;
            background: #eaf4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 500px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #2c5aa0;
        }

        input[type="text"],
input[type="number"],
input[type="date"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

input[type="radio"] {
    width: auto;
    margin-right: 5px;
}

input[type="submit"] {
    width: 100%;
    padding: 10px;
    background: #2c8cff;
    color: white;
    border: none;
    cursor: pointer;
}

input[type="submit"]:hover {
    background: #176fd1;
}

        input[type="submit"] {
            background: #2c8cff;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #176fd1;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="box">

<h1>薬品登録</h1>

<form action="AddMedicineServlet" method="post">

    <label>薬品名</label>
    <input type="text" name="name" required>

    <label>登録日時</label>
    <input type="date" name="day" required>

    <label>本数</label>
    <input type="number" min="1" name="botoru" required>

   
   
    <label>劇・毒物</label><br>

<label>
    <input type="radio" name="danger" value="yes" checked>
    はい
</label>

<label style="margin-left:20px;">
    <input type="radio" name="danger" value="no">
    いいえ
</label>
    <br><br>
    
    <input type="submit" value="登録">

</form>

</div>

</body>
</html>
