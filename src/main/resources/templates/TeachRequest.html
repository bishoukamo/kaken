<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org">
     <head>
        <meta charset="UTF-8"> 
        <title>管理ユーザ申請一覧</title>
     </head> 
     <body> 
        <h2>管理ユーザ申請一覧</h2> 
        <table border="1"> <tr>
            <th>ユーザID</th>
            <th>ユーザ名</th> 
            <th>学籍番号</th> 
            <th>メールアドレス</th>
            <th>登録日時</th>
            <th>操作</th>
        </tr> 
            <tr th:each="user : ${requestList}"> 
            <td th:text="${user.user_id}"></td> 
            <td th:text="${user.u_name}"></td> 
            <td th:text="${user.gakuban}"></td>             
            <td th:text="${user.mail}"></td> 
            <td th:text="${user.setting}"></td>
            <td> 
                <form th:action="@{/admin/teach/approve}" method="post"> 
                    <input type="hidden" name="userId" th:value="${user.user_id}"> 
                        <button type="submit">
                            承認
                        </button> 
                </form>
            </td> 
        </tr> 
        </table> 
    </body> 
</html>
