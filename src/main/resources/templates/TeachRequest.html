<!DOCTYPE html> 
<meta charset="UTF-8"> 
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu-style.css">
    <link rel="stylesheet" href="button-style.css">
    <link rel="stylesheet" href="table.css">


    <style>
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;

            z-index: 1000;
        }
    </style>

</head>

<body>
    
    <div class="header">
        <h2>薬品管理システム</h2>
    </div>

    <div id="maingamen">
        <div class="box">
        <h2>管理ユーザ申請一覧</h2>
    <table class="log-table"> 
    <thead>
        <tr>
            <th>ユーザID</th>
            <th>ユーザ名</th> 
            <th>学籍番号</th> 
            <th>メールアドレス</th>
            <th>登録日時</th>
            <th>操作</th>
        </tr> 
    </thead>
        
    <tbody>
        <tr th:each="user : ${requestList}"> 
            <td th:text="${user.user_id}"></td> 
            <td th:text="${user.u_name}"></td> 
            <td th:text="${user.gakuban}"></td>             
            <td th:text="${user.mail}"></td> 
            <td th:text="${user.setting}"></td>
            <td> 
                <form th:action="@{/admin/teach/approve}" method="post"> 
                    <input type="hidden" name="userId" th:value="${user.user_id}"> 
                        <button type="submit">
                            承認
                        </button> 
                </form>
            </td> 
        </tr> 
    </tbody>
</table>
        </div>
    <app-menu></app-menu>
    <script src="menu-script.js"></script>
    </div>
    
    </body> 
</html>
