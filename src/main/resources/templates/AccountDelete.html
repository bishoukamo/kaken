<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント削除</title>
</head>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu-style.css">
    <link rel="stylesheet" href="button-style.css">

    <style>

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;

            z-index: 1000;
        }

        .info-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #dc3545;
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            padding: 6px 0;
        }

        .info-row .label {
            width: 130px;
            font-weight: bold;
            color: #333;
        }

        .info-row .value {
            color: #555;
        }

        .form-label {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    

<!-- ヘッダー -->


<div class="header">
    <h2>薬品管理システム</h2>
</div>

<div id="maingamen">
    <div class="container">
        <div class="info-box">
            <h2>アカウント削除</h2>

<p>
    ユーザ名：
    <span th:text="${user.u_name}"></span>
</p>
        <div class="alert alert-danger" role="alert">
            アカウントを削除しますか？<br>
            この操作は取り消すことができません。
        </div>

<p>
    メールアドレス：
    <span th:text="${user.mail}"></span>
</p>
        <form th:action="@{/account/delete}" method="post">

<form th:action="@{/account/delete}" method="post">
            <!-- CSRF対策 -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

    <!-- CSRF対策 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label">ユーザ名</label>
                <input type="text" name="u_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">メールアドレス</label>
                <input type="email" name="mail" class="form-control" required>
            </div>

            <p th:if="${error}"
                th:text="${error}"
                style="color:red;">
            </p>
            <div class="mb-3">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <p th:if="${error}"
               th:text="${error}"
               class="text-danger">
            </p>

        </form>
            <button type="submit" class="btn btn-danger w-100">アカウントを削除する</button>
            <br>
        </form>

    <a th:href="@{/mypage}">
        マイページへ戻る
    </a>
        <div class="mt-3 text-center">
            <a th:href="@{/mypage}" class="btn btn-outline-secondary btn-sm">マイページへ戻る</a>
        </div>
    </div>
</div>
</div>
    <app-menu></app-menu>
    <script src="menu-script.js"></script>
</body>
</html>
