<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント削除</title>
</head>

<body>

<h1>アカウント削除</h1>

<p>
    アカウントを削除しますか？
</p>

<p>
    この操作は取り消すことができません。
</p>

<p>
    ユーザ名：
    <span th:text="${user.u_name}"></span>
</p>

<p>
    メールアドレス：
    <span th:text="${user.mail}"></span>
</p>

<form th:action="@{/account/delete}" method="post">

    <!-- CSRF対策 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <p>
        パスワード：
        <input type="password"
               name="password"
               required>
    </p>

    <p th:if="${error}"
       th:text="${error}"
       style="color:red;">
    </p>

    <button type="submit">
        アカウントを削除する
    </button>

</form>

<br>

<a th:href="@{/mypage}">
    マイページへ戻る
</a>

</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>マイページ</title>
</head>

<body>

<h1>マイページ</h1>

<h2>ユーザ情報</h2>

<p>
    ユーザ名：
    <span th:text="${user.u_name}"></span>
</p>

<p>
    ユーザID：
    <span th:text="${user.user_id}"></span>
</p>

<p>
    権限：
    <span th:text="${user.yakuwari}"></span>
</p>

<p>
    登録日時：
    <span   th:if="${user.setting != null}"
            th:text="${#temporals.format(user.setting, 'yyyy/MM/dd HH時mm分')}">
    </span>
    <span th:unless="${user.setting != null}">
        未登録
    </span>
</p>


<h2>使用記録</h2>

<a th:href="@{/mysiyoulog}">
    自分の使用記録
</a>


<h2>アカウント設定</h2>

<p>
    <a th:href="@{/mypage/password}">
        パスワードの変更
    </a>
</p>

<p>
    <a th:href="@{/mail/change}">
        メールアドレスの変更
    </a>
</p>


<h2>その他</h2>

<p>
    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button th:type="@{/account/delete}">
            ログアウト
        </button>
    </form>
</p>

<p>
    <a th:href="@{/account/delete}">
        アカウント削除
    </a>
</p>

</html>
