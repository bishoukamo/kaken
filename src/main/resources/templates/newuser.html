<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規ユーザ登録</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .register-container {
            width: 420px;
            max-width: 90%;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .register-container h1 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #555;
        }

        .notice {
            margin-top: 8px;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 6px;
            background: #f5f5f5;
            font-size: 13px;
            line-height: 1.6;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 6px;
            background: #fff0f0;
            color: #c00;
            font-size: 14px;
            line-height: 1.5;
        }

        .register-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register-button:hover {
            background: #555;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #333;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>新規ユーザ登録</h1>

    <!-- エラー表示 -->
    <p th:if="${error}"
       th:text="${error}"
       class="error-message">
    </p>

    <form th:action="@{/user/new}"
          th:object="${user}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- ユーザ名 -->
        <div class="form-group">
            <label for="u_name">
                ユーザ名
            </label>

            <input type="text"
                   id="u_name"
                   th:field="*{u_name}"
                   placeholder="ユーザ名を入力"
                   required>
        </div>

        <!-- 出席番号 -->
        <div class="form-group">
            <label for="gakuban">
                出席番号
            </label>

            <input type="number"
                   id="gakuban"
                   th:field="*{gakuban}"
                   placeholder="出席番号を入力"
                   required>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
            <label for="mail">
                メールアドレス
            </label>

            <input type="email"
                   id="mail"
                   th:field="*{mail}"
                   placeholder="メールアドレスを入力"
                   required>
        </div>

        <!-- パスワード -->
        <div class="form-group">
            <label for="pass">
                パスワード
            </label>

            <input type="password"
                   id="pass"
                   th:field="*{pass}"
                   placeholder="パスワードを入力"
                   required>
        </div>

        <!-- パスワード確認 -->
        <div class="form-group">
            <label for="passwordConfirm">
                パスワード（確認）
            </label>

            <input type="password"
                   id="passwordConfirm"
                   name="passwordConfirm"
                   placeholder="もう一度パスワードを入力"
                   required>
        </div>

        <!-- 権限 -->
        <div class="form-group">
            <label for="yakuwariSelect">
                権限
            </label>

            <select id="yakuwariSelect"
                    name="yakuwariSelect"
                    required>

                <option value="seito">
                    一般ユーザ
                </option>

                <option value="teach">
                    管理ユーザを希望
                </option>

            </select>
        </div>

        <!-- 管理ユーザ申請について -->
        <div class="notice">
            ※管理ユーザを希望する場合は、
            管理ユーザの承認が必要です。
            <br>
            承認を受理するまで一般ユーザとしての利用となります。
        </div>

        <!-- 登録情報について -->
        <div class="notice">
            ※ユーザ名・出席番号・権限の登録情報は、
            登録後に変更できません。
            <br>
            入力内容を確認してから登録してください。
        </div>

        <!-- 登録ボタン -->
        <button type="submit" class="register-button">
            登録
        </button>

    </form>

    <!-- ログイン画面へ -->
    <div class="login-link">
        <a th:href="@{/login}">
            ログイン画面へ戻る
        </a>
    </div>

</div>

</body>
</html>
