<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eaf4ff;
            font-family: "Arial", "Noto Sans JP", sans-serif;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2c5aa0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #2c8cff;
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #2c8cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #176fd1;
        }

        .new-registration {
            text-align: center;
            margin-top: 25px;
        }

        .new-registration a {
            color: #2c8cff;
            text-decoration: none;
            font-size: 14px;
        }

        .new-registration a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">
         <div class="text-center mb-3">
    <div style="font-size:60px;">💊</div>
    </div>

        <h1>ログイン</h1>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">

            <label>メールアドレス</label>
            <input type="email" name="email" required>

            <label>パスワード</label>
            <input type="password" name="password" required>

            <button type="submit">ログイン</button>
        </form>
        <div class="new-registration">
            <!--href="homegamen.htmlは試しのために作ったので消してね
            th:href=""の中身に\Controllerみたいにコントローラー名を指定してね-->
            <a href="homegamen.html" th:href="">新規登録はこちらから</a>
        </div>
    </div>

</body>
</html>
