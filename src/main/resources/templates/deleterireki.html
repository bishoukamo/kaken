<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>削除履歴</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f4f6f9;
}

.card{
    max-width:700px;
    margin:60px auto;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.table-wrap{
    max-height:400px;
    overflow-y:auto;
}

.empty-state{
    padding:40px 10px;
    text-align:center;
    color:#6c757d;
}
</style>

</head>
<body>

<div class="card">
    <div class="card-header bg-secondary text-white text-center">
        <h3>削除履歴</h3>
    </div>

    <div class="card-body">

        <div class="table-wrap">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-light" style="position:sticky; top:0;">
                    <tr>
                        <th scope="col">薬品名</th>
                        <th scope="col">削除日時</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!--
                        ここにサーバー側から取得した削除履歴を1行ずつ出力する想定です。

                        JSPで実装する場合の例（JSTL使用）:
                        <c:forEach var="item" items="${historyList}">
                            <tr>
                                <td>${item.medicineName}</td>
                                <td>${item.deletedAt}</td>
                            </tr>
                        </c:forEach>

                        サンプル行（動作イメージ確認用。実データ接続後は削除してください）
                    -->
                    <tr>
                        <td>アスピリン</td>
                        <td>2026/08/19 14:32</td>
                    </tr>
                    <tr>
                        <td>ロキソニン</td>
                        <td>2026/08/18 10:05</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 履歴が1件もない場合の表示例。tbodyを空にした際はこちらを表示してください -->
        <!--
        <div class="empty-state">
            削除履歴はまだありません。
        </div>
        -->

        <div class="mt-3 text-center">
            <a href="homegamen.html" class="btn btn-secondary">
                ホームへ戻る
            </a>

            <a hred="delete.html" class="btn btn-info">
                削除画面
            </a>
        </div>

    </div>
</div>

</body>
</html>
